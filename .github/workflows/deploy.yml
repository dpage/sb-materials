name: Deploy

# Ships sb-materials to one of two installations:
#
#   test        the pre-production instance, deployed automatically on every
#               push to main, and on demand from any ref
#   production  the live service, deployed when a version tag (v*.*.*) is
#               pushed, and on demand from any ref
#
# Each target is a GitHub environment holding its own copy of the deploy
# secrets, so the same workflow reaches a different host depending on which one
# it selects. Give the production environment required reviewers if you want a
# human to approve every live deploy; the test one is better left ungated,
# since the whole point of it is to be cheap to deploy to.
#
# This updates only the running app (rebuild from git + restart). It does NOT
# apply infrastructure or config changes - those live in the conx-ansible
# `sb_materials` role, and that includes TEST_DEPLOYMENT, which is what makes
# the test installation badge itself. The server-side work is done by
# /usr/local/sbin/sb-materials-deploy on the host, which this workflow invokes
# over SSH as a dedicated low-privilege account whose sudo is scoped to that
# one command.
#
# Required configuration, per environment (Settings -> Environments -> test,
# and again for production):
#   Secrets:
#     SB_MATERIALS_DEPLOY_SSH_KEY     - private half of the dedicated deploy keypair
#     SB_MATERIALS_DEPLOY_KNOWN_HOSTS - output of: ssh-keyscan -p 8080 <host>
#     SB_MATERIALS_DEPLOY_HOST        - deploy host (e.g. kielbasa.conx.page)
#   Variables:
#     SB_MATERIALS_DEPLOY_TARGET      - REQUIRED: "test" or "production", matching
#                                       the environment it is defined in
#     SB_MATERIALS_DEPLOY_PORT        - optional, SSH port (default 8080)
#     SB_MATERIALS_DEPLOY_USER        - optional, deploy account (default sb-materials-deploy)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: "Which installation to deploy to"
        required: true
        type: choice
        default: test
        options: [test, production]
      ref:
        description: "Git ref (branch, tag, or commit) to deploy"
        required: false
        default: main

jobs:
  # Works out what is being deployed where, so that the deploy job can name its
  # environment: a job-level `environment:` expression cannot see steps in its
  # own job, which is why this is a separate job rather than a first step.
  prepare:
    name: Choose target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.choose.outputs.target }}
      ref: ${{ steps.choose.outputs.ref }}
    steps:
      - id: choose
        env:
          EVENT: ${{ github.event_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
              target="$INPUT_TARGET"
              ref="$INPUT_REF"
          elif [ "$IS_TAG" = "true" ]; then
              # A version tag is the release signal: deploy the tag itself, so
              # the live service is running exactly what was tagged.
              target="production"
              ref="$TAG_NAME"
          else
              # Deploy main by name rather than by commit SHA: the host fetches
              # the ref from GitHub, and a branch name is the one thing it is
              # certain to be able to fetch.
              target="test"
              ref="main"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying '$ref' to the $target installation"

  deploy:
    name: Deploy to ${{ needs.prepare.outputs.target }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.target }}
    # Never let two deploys of the same installation race; queue them instead.
    # The two installations deploy independently of one another.
    concurrency:
      group: sb-materials-deploy-${{ needs.prepare.outputs.target }}
      cancel-in-progress: false
    steps:
      # An environment that defines no secrets of its own silently inherits the
      # repository's, so a half-configured `test` environment would deploy main
      # onto production and nothing would look wrong until Stew noticed. Each
      # environment therefore names itself in a variable, which is environment
      # scoped and has no repository-level fallback to inherit.
      - name: Confirm this environment is configured
        env:
          EXPECTED: ${{ needs.prepare.outputs.target }}
          CONFIGURED: ${{ vars.SB_MATERIALS_DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          if [ "$CONFIGURED" != "$EXPECTED" ]; then
              echo "The '$EXPECTED' environment is not configured: its SB_MATERIALS_DEPLOY_TARGET" >&2
              echo "variable reads '${CONFIGURED:-(unset)}' rather than '$EXPECTED'. Refusing to deploy," >&2
              echo "because an environment with no secrets of its own inherits the repository's and" >&2
              echo "would deploy to the wrong installation." >&2
              exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SB_MATERIALS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SB_MATERIALS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.SB_MATERIALS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.SB_MATERIALS_DEPLOY_PORT || '8080' }}
          DEPLOY_USER: ${{ vars.SB_MATERIALS_DEPLOY_USER || 'sb-materials-deploy' }}
          DEPLOY_REF: ${{ needs.prepare.outputs.ref }}
          DEPLOY_TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          set -euo pipefail
          # ssh concatenates the remote argv into a single shell command, so a
          # ref with shell metacharacters would be an injection vector. Reject
          # anything that isn't a plain branch/tag/commit name. The server-side
          # script applies the same check as a second line of defence.
          if ! [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Refusing to deploy suspicious ref: '$DEPLOY_REF'" >&2
              exit 1
          fi
          echo "Deploying ref '${DEPLOY_REF}' to the ${DEPLOY_TARGET} installation at ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT}"
          ssh -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -i ~/.ssh/id_deploy \
              -p "$DEPLOY_PORT" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "sudo /usr/local/sbin/sb-materials-deploy '${DEPLOY_REF}'"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy
